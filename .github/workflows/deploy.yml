name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm ci
      # Lint note formatting (KaTeX/math, theorem boxes, front matter) before building.
      - run: python3 scripts/check_notes.py
      # Regenerate the notes-completion report from current content each build.
      - run: python3 scripts/notes_progress.py
      # Supabase URL/anon key are committed as public defaults in src/lib/supabase.ts,
      # so no build-time secrets are needed.
      #
      # PUBLIC_FRQ_GRADER_URL points the in-note FRQ grader at the deployed
      # grade-frq Supabase function. Set it as a repo *variable* (Settings >
      # Secrets and variables > Actions > Variables). If unset, the build still
      # succeeds and FRQ questions render normally — just without a Grade button.
      # `npm run build` runs `prebuild` first, regenerating the FRQ manifest.
      - run: npm run build
        env:
          PUBLIC_FRQ_GRADER_URL: ${{ vars.PUBLIC_FRQ_GRADER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
