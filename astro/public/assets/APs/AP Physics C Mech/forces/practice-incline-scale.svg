    <rect x="289" y="105" width="70" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="324" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#ef4444">m</text>
    <text x="324" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#2563eb">scale</text>
